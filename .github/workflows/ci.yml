name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile Python
        run: python -m compileall -q app
      - name: Validate installer shell scripts
        run: bash -n install.sh install/bootstrap.sh install/wireguard-hub.sh
      - name: Validate Compose
        run: docker compose config -q
        env:
          PORTAINER_URL: https://127.0.0.1:9443
          PORTAINER_TOKEN: test
          MOVER_USER: admin
          MOVER_PASSWORD: test-password
          MOVER_SESSION_SECRET: 12345678901234567890123456789012
      - name: Build image
        run: docker build -t dockerstackmover:ci .
      - name: Build Capacity Agent image
        run: docker build -t dockerstackmover-capacity-agent:ci ./agent

  publish:
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and publish application image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/drbanek/dockerstackmover:latest
            ghcr.io/drbanek/dockerstackmover:sha-${{ github.sha }}
            ${{ startsWith(github.ref, 'refs/tags/v') && format('ghcr.io/drbanek/dockerstackmover:{0}', github.ref_name) || '' }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
      - name: Build and publish Capacity Agent image
        uses: docker/build-push-action@v6
        with:
          context: ./agent
          push: true
          tags: |
            ghcr.io/drbanek/dockerstackmover-capacity-agent:latest
            ghcr.io/drbanek/dockerstackmover-capacity-agent:sha-${{ github.sha }}
            ${{ startsWith(github.ref, 'refs/tags/v') && format('ghcr.io/drbanek/dockerstackmover-capacity-agent:{0}', github.ref_name) || '' }}
          cache-from: type=gha,scope=capacity-agent
          cache-to: type=gha,mode=max,scope=capacity-agent

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "DockerStackMover ${GITHUB_REF_NAME}" \
            --notes-file RELEASE-2.0.0.md

# publish trigger: v1.13.20
